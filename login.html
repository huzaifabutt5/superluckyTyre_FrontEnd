<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Super Lucky Tyre</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <main class="auth-wrapper">

        <div class="logo-container">
            <img src="images/loginLogo.svg" alt="Super Lucky Tyre" class="brand-logo">
        </div>

        <div class="auth-card">

            <section id="loginStep" class="auth-step active">

                <div class="card-header-bar">
                    <h2 class="auth-title">Login Now</h2>
                </div>

                <div class="card-body">

                    <form id="loginForm">

                        <div class="form-fields-group">

                            <div class="form-group">
                                <label for="loginEmail">Email Address</label>

                                <div class="input-wrapper">
                                    <img src="images/mail-01.svg"
                                        class="input-icon" alt="">

                                    <input type="email"
                                        id="loginEmail"
                                        placeholder="Email Address"
                                        required>
                                </div>
                            </div>


                            <div class="form-group">
                                <label for="loginPassword">Password</label>

                                <div class="input-wrapper">
                                    <img src="images/lock-password.svg"
                                        class="input-icon">

                                    <input type="password"
                                        id="loginPassword"
                                        placeholder="Enter Password"
                                        required>
                                </div>
                            </div>


                            <div class="form-actions-right">
                                <a href="reset-password.html"
                                    id="gotoForgot"
                                    class="forgot-link">
                                    forget password?
                                </a>
                            </div>

                        </div>

                        <button type="submit" class="btn-primary">
                            Submit form
                        </button>

                    </form>

                </div>

            </section>

        </div>

    </main>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>


</body>

</html>
