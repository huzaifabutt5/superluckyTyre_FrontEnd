<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password - Super Lucky Tyre</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <main class="auth-wrapper">

        <div class="logo-container">
            <img src="images/loginLogo.svg" alt="Super Lucky Tyre" class="brand-logo">
        </div>

        <div class="auth-card">

            <section id="newPasswordStep" class="auth-step newpass-card-step active">

                <div class="newpass-header-bar">

                    <h2 class="auth-title newpass-heading">
                        Set New Password
                    </h2>

                </div>

                <div class="newpass-card-body">

                    <form id="newPasswordForm" class="newpass-form-container">

                        <div class="newpass-fields-group">

                            <div class="newpass-field-group">

                                <label for="newPassword" class="newpass-label">
                                    New Password
                                </label>

                                <div class="newpass-input-wrapper">

                                    <img src="images/lock-password.svg" alt="Lock Icon" class="newpass-input-icon">

                                    <input type="password" id="newPassword" class="newpass-input-field"
                                        placeholder="New Password" required>

                                </div>

                            </div>


                            <div class="newpass-field-group">

                                <label for="confirmPassword" class="newpass-label">
                                    Confirm Password
                                </label>

                                <div class="newpass-input-wrapper">

                                    <img src="images/lock-password.svg" alt="Lock Icon" class="newpass-input-icon">

                                    <input type="password" id="confirmPassword" class="newpass-input-field"
                                        placeholder="Confirm Password" required>

                                </div>

                            </div>

                        </div>

                        <button type="submit" class="btn-primary newpass-submit-btn">
                            Set New Password
                        </button>

                    </form>

                </div>

            </section>

        </div>

    </main>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>


</body>

</html>
