<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Super Lucky Tyre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>


    <main class="auth-wrapper">
        <div class="logo-container">
            <img src="images/loginLogo.svg" alt="Super Lucky Tyre" class="brand-logo">
        </div>


        <div class="auth-card">
           
            <!-- ================= STEP 2: RESET PASSWORD (SEND OTP) ================= -->

            <section id="forgotStep" class="auth-step forgot-card-step active">

                <!-- Card Header -->
                <div class="forgot-header-bar">
                    <h2 class="auth-title forgot-heading">Reset Password</h2>
                </div>

                <!-- Form Body -->
                <div class="forgot-card-body">
                    <form id="forgotForm" class="forgot-form-container">

                        <div class="forgot-field-group">
                            <label for="resetEmail" class="forgot-label">Email Address</label>
                            <div class="forgot-input-wrapper">
                                <img src="images/mail-01.svg" alt="Email Icon" class="forgot-input-icon">
                                <input type="email" id="resetEmail" class="forgot-input-field"
                                    placeholder="Email Address" required>
                            </div>
                        </div>

                        <!-- Send OTP Button -->
                        <button type="submit" class="btn-primary forgot-submit-btn">Send OTP</button>

                    </form>
                </div>

            </section>

    

        </div>
    </main>





    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>




</html>
